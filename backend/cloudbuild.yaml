options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Etapa 1: Build da imagem Docker do backend
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'backend'  # já estamos na pasta backend
    args: [
      'build', '-t',
      'gcr.io/$PROJECT_ID/backend-cdc', '.'
    ]

  # Etapa 2: Push da imagem para o Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'gcr.io/$PROJECT_ID/backend-cdc'
    ]

  # Etapa 3: Deploy para o Cloud Run com variáveis de ambiente e Cloud SQL Proxy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'backend-cdc',
      '--image', 'gcr.io/$PROJECT_ID/backend-cdc',
      '--region', 'southamerica-east1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--add-cloudsql-instances', 'cdc-org:southamerica-east1:postgres-cdc',
      '--set-env-vars',
      'NODE_ENV=production,DB_USER=appuser,DB_PASSWORD=NovaSenhaForte2025,DB_NAME=postgres,DB_HOST=/cloudsql/cdc-org:southamerica-east1:postgres-cdc',
      '--timeout', '900s',
      '--cpu', '1',
      '--memory', '512Mi'
    ]
