options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Etapa 1: Build da imagem Docker do backend
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'backend'  # já estamos na pasta backend
    args: [
      'build', '-t',
      'gcr.io/$PROJECT_ID/backend-cdc', '.'
    ]

  # Etapa 2: Push da imagem para o Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'gcr.io/$PROJECT_ID/backend-cdc'
    ]

  # Etapa 3: Deploy para o Cloud Run com variáveis de ambiente
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'backend-cdc',
      '--image', 'gcr.io/$PROJECT_ID/backend-cdc',
      '--region', 'southamerica-east1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--set-env-vars',
      'DB=postgres,DB_HOST=$_DB_HOST,DB_PORT=$_DB_PORT,DB_USER=$_DB_USER,DB_PASSWORD=$_DB_PASSWORD,DB_NAME=$_DB_NAME'
    ]

