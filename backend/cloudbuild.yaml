options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Etapa 1: Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'backend'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/backend-cdc', '.']

  # Etapa 2: Push da imagem
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/backend-cdc']

  # Etapa 3: Deploy seguro no Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - backend-cdc
      - --image=gcr.io/$PROJECT_ID/backend-cdc
      - --region=southamerica-east1
      - --platform=managed
      - --allow-unauthenticated
      - --add-cloudsql-instances=${_INSTANCE_CONNECTION_NAME}
      - --set-env-vars=NODE_ENV=${_NODE_ENV},DB_USER=${_DB_USER},DB_NAME=${_DB_NAME},DB_HOST=${_DB_HOST},EMAIL_FROM=${_EMAIL_FROM},EMAIL_PASSWORD=${_EMAIL_PASSWORD}
      - --set-secrets=DB_PASSWORD=DB_PASSWORD_SECRET:latest
      - --timeout=900s